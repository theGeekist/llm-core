name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Check source size boundaries
        run: bun run check:sloc

      - name: Qualify external consumer fixtures
        run: bun run qualify:external-fixtures

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Smoke test package exports
        run: bun run test:package

      - name: Typecheck
        run: bun run typecheck

      - name: Typecheck Tests
        run: bun run typecheck:tests

      - name: Test
        run: bun run test -- --coverage --coverage-reporter=text --coverage-reporter=lcov

      - name: Typecheck Examples
        run: bun run typecheck:examples

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unit
          fail_ci_if_error: false

  pydantic-ai-conformance:
    name: PydanticAI conformance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Build strict-json dependency
        run: bun run --cwd packages/strict-json build

      - name: Install exact PydanticAI runtime
        run: |
          python -m venv .venv-pydantic-ai
          .venv-pydantic-ai/bin/python -m pip install "pydantic-ai-slim==2.19.0"

      - name: Run exact-runtime conformance
        run: bun test packages/llm-core/tests/conformance
        env:
          LLM_CORE_PYDANTIC_AI_PYTHON: ${{ github.workspace }}/.venv-pydantic-ai/bin/python

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build strict-json dependency
        run: bun run --cwd packages/strict-json build

      - name: Debug
        run: ls -R packages

      - name: Test
        run: bun run test -- --coverage --coverage-reporter=text --coverage-reporter=lcov

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

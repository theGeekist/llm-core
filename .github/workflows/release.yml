name: Release

on:
  push:
    tags:
      - "v*"
      - "strict-json-v*"
      - "aifsd-v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-strict-json:
    if: startsWith(github.ref, 'refs/tags/strict-json-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: ".bun-version"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.13.0"
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Validate strict-json manifest, tag and live source
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          bun run scripts/release-history/release-controller.ts
          --phase validate --package strict-json --tag "$GITHUB_REF_NAME"

      - name: Qualify strict-json release
        run: bun run release:qualify:strict-json

      - name: Prepare exact strict-json archive
        id: artifact
        run: >-
          bun run scripts/release-history/prepare-artifact.ts
          --package strict-json
          --output "$RUNNER_TEMP/release-artifacts"
          --github-output "$GITHUB_OUTPUT"

      - name: Verify exact strict-json archive
        run: >-
          node packages/strict-json/scripts/smoke-package.mjs
          --tarball "${{ steps.artifact.outputs.tarball }}"

      - name: Upload strict-json release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: strict-json-${{ github.ref_name }}-release-evidence
          path: |
            ${{ steps.artifact.outputs.tarball }}
            ${{ steps.artifact.outputs.metadata }}
          if-no-files-found: error
          retention-days: 90

  release-core:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: ".bun-version"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.13.0"
          registry-url: "https://registry.npmjs.org"

      - name: Validate llm-core manifest, tag and live source
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          bun run scripts/release-history/release-controller.ts
          --phase validate --package llm-core --tag "$GITHUB_REF_NAME"

      - name: Qualify Core release
        run: bun run release:qualify:llm-core

      - name: Verify strict-json dependency is published
        id: strict_json
        run: >-
          bun run scripts/download-published-package.ts
          --package strict-json
          --output "$RUNNER_TEMP/release-dependencies/strict-json.tgz"
          --github-output "$GITHUB_OUTPUT"

      - name: Prepare exact llm-core archive
        id: artifact
        run: >-
          bun run scripts/release-history/prepare-artifact.ts
          --package llm-core
          --output "$RUNNER_TEMP/release-artifacts"
          --github-output "$GITHUB_OUTPUT"

      - name: Verify exact llm-core archive
        run: >-
          node packages/llm-core/scripts/smoke-package.mjs
          --prebuilt
          --tarball "${{ steps.artifact.outputs.tarball }}"
          --strict-json-tarball "${{ steps.strict_json.outputs.tarball }}"

      - name: Upload llm-core release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: llm-core-${{ github.ref_name }}-release-evidence
          path: |
            ${{ steps.artifact.outputs.tarball }}
            ${{ steps.artifact.outputs.metadata }}
            ${{ steps.strict_json.outputs.tarball }}
          if-no-files-found: error
          retention-days: 90

  release-aifsd:
    if: startsWith(github.ref, 'refs/tags/aifsd-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: ".bun-version"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.13.0"
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Validate AIFSD manifest, tag and live source
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          bun run scripts/release-history/release-controller.ts
          --phase validate --package aifsd --tag "$GITHUB_REF_NAME"

      - name: Qualify AIFSD source candidate
        run: bun run --cwd packages/aifsd release:build

      - name: Download exact published strict-json dependency
        id: strict_json
        run: >-
          bun run scripts/download-published-package.ts
          --package strict-json
          --output "$RUNNER_TEMP/release-dependencies/strict-json.tgz"
          --github-output "$GITHUB_OUTPUT"

      - name: Download exact published llm-core dependency
        id: llm_core
        run: >-
          bun run scripts/download-published-package.ts
          --package llm-core
          --output "$RUNNER_TEMP/release-dependencies/llm-core.tgz"
          --github-output "$GITHUB_OUTPUT"

      - name: Download exact published pipeline dependency
        id: pipeline
        run: >-
          bun run scripts/download-published-package.ts
          --package pipeline
          --output "$RUNNER_TEMP/release-dependencies/pipeline.tgz"
          --github-output "$GITHUB_OUTPUT"

      - name: Prepare exact AIFSD archive
        id: artifact
        run: >-
          bun run scripts/release-history/prepare-artifact.ts
          --package aifsd
          --output "$RUNNER_TEMP/release-artifacts"
          --github-output "$GITHUB_OUTPUT"

      - name: Qualify exact AIFSD and dependency archives
        run: >-
          node packages/aifsd/scripts/smoke-package.mjs
          --prebuilt
          --tarball "${{ steps.artifact.outputs.tarball }}"
          --llm-core-tarball "${{ steps.llm_core.outputs.tarball }}"
          --strict-json-tarball "${{ steps.strict_json.outputs.tarball }}"
          --pipeline-tarball "${{ steps.pipeline.outputs.tarball }}"

      - name: Upload AIFSD release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aifsd-${{ github.ref_name }}-release-evidence
          path: |
            ${{ steps.artifact.outputs.tarball }}
            ${{ steps.artifact.outputs.metadata }}
            ${{ steps.llm_core.outputs.tarball }}
            ${{ steps.strict_json.outputs.tarball }}
            ${{ steps.pipeline.outputs.tarball }}
          if-no-files-found: error
          retention-days: 90

  publish-npm:
    needs: [release-strict-json, release-core, release-aifsd]
    if: >-
      always() &&
      (needs.release-strict-json.result == 'success' ||
      needs.release-core.result == 'success' ||
      needs.release-aifsd.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Resolve tag package
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            strict-json-v*) package_key='strict-json' ;;
            aifsd-v*) package_key='aifsd' ;;
            v*) package_key='llm-core' ;;
            *) exit 1 ;;
          esac
          printf 'package=%s\n' "$package_key" >> "$GITHUB_OUTPUT"

      - name: Checkout exact tagged source without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node for npm trusted publishing
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.13.0"
          registry-url: "https://registry.npmjs.org"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: ".bun-version"

      - name: Download exact qualified release evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ steps.identity.outputs.package }}-${{ github.ref_name }}-release-evidence
          path: ${{ runner.temp }}/release-evidence

      - name: Resolve exact qualified archive
        id: artifact
        run: >-
          node scripts/release-history/resolve-release-artifact.mjs
          --evidence "$RUNNER_TEMP/release-evidence"
          --github-output "$GITHUB_OUTPUT"

      - name: Publish once and reconcile exact registry bytes
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_KEY: ${{ steps.identity.outputs.package }}
        run: >-
          bun run scripts/release-history/release-controller.ts
          --phase publish --package "$PACKAGE_KEY" --tag "$GITHUB_REF_NAME"
          --tarball "${{ steps.artifact.outputs.tarball }}"
          --metadata "${{ steps.artifact.outputs.metadata }}"

  project-github-release:
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve tag package
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            strict-json-v*) package_key='strict-json' ;;
            aifsd-v*) package_key='aifsd' ;;
            v*) package_key='llm-core' ;;
            *) exit 1 ;;
          esac
          printf 'package=%s\n' "$package_key" >> "$GITHUB_OUTPUT"

      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node for release evidence resolution
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.13.0"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: ".bun-version"

      - name: Download exact qualified release evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ steps.identity.outputs.package }}-${{ github.ref_name }}-release-evidence
          path: ${{ runner.temp }}/release-evidence

      - name: Resolve exact qualified archive
        id: artifact
        run: >-
          node scripts/release-history/resolve-release-artifact.mjs
          --evidence "$RUNNER_TEMP/release-evidence"
          --github-output "$GITHUB_OUTPUT"

      - name: Create idempotent GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          generate_release_notes: true

      - name: Verify publication and write receipt
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_KEY: ${{ steps.identity.outputs.package }}
        run: >-
          bun run scripts/release-history/release-controller.ts
          --phase receipt --package "$PACKAGE_KEY" --tag "$GITHUB_REF_NAME"
          --tarball "${{ steps.artifact.outputs.tarball }}"
          --metadata "${{ steps.artifact.outputs.metadata }}"
          --receipt-output "$RUNNER_TEMP/release-receipt.json"

      - name: Reconcile immutable publication receipt
        run: >-
          bun run scripts/release-history/reconcile-receipt-asset.ts
          --tag "$GITHUB_REF_NAME" --receipt "$RUNNER_TEMP/release-receipt.json"
        env:
          GH_TOKEN: ${{ github.token }}

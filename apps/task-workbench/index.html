<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Architect Workbench</title>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #0d1117;
      }
      #bootstrap-graph {
        position: relative;
        top: 50%;
        left: 50%;
        width: 72px;
        height: 108px;
        transform: translate(-50%, -50%);
      }
      #bootstrap-graph::before,
      #bootstrap-graph::after {
        position: absolute;
        left: 35px;
        width: 1px;
        height: 24px;
        background: #30363d;
        content: "";
      }
      #bootstrap-graph::before {
        top: 26px;
      }
      #bootstrap-graph::after {
        top: 74px;
      }
      #bootstrap-graph i {
        position: absolute;
        left: 0;
        width: 70px;
        height: 24px;
        border: 1px solid #30363d;
        background: linear-gradient(90deg, #161b22 20%, #202731 50%, #161b22 80%);
        background-size: 240% 100%;
        animation: bootstrap-graph-loading 1.1s ease-in-out infinite;
      }
      #bootstrap-graph i:nth-child(1) {
        top: 0;
      }
      #bootstrap-graph i:nth-child(2) {
        top: 41px;
        animation-delay: 90ms;
      }
      #bootstrap-graph i:nth-child(3) {
        top: 82px;
        animation-delay: 180ms;
      }
      @keyframes bootstrap-graph-loading {
        from {
          background-position: 100% 0;
        }
        to {
          background-position: -100% 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #bootstrap-graph i {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="bootstrap-graph" aria-hidden="true"><i></i><i></i><i></i></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

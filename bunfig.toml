[install]
linkWorkspacePackages = true

[test]
# root = "."  # Removed restricted root to allow workspace-wide testing or filter-based testing
pathIgnorePatterns = ["context/**"]
coverageReporter = ["text", "lcov"]
coveragePathIgnorePatterns = ["tests/**", "**/*.test.ts", "**/tests/**", "examples/**", "assistant-ui/**"]
